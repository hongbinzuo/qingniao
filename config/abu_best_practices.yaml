# ABU best-practice rulebook (ebook + pattern guidance)
enabled: true
rules:
  require_pattern_match: false
  min_pattern_score: 0.1
  min_brooks_score: 0.0
  allowed_brooks_status: ["pass", "warn", "fail"]
  allow_against_trend: true
  strong_trend_threshold: 0.02
  range_mode_only_patterns: []
  trend_mode_avoid_patterns: []
  require_breakout_confirmation: false
  max_stop_pct: 0.05
  min_rr: 0.8
