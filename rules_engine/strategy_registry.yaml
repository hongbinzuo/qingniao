strategies:
  # 梦多空策略（涨幅榜做空+追多）
  meng_duo_kong:
    name: "梦多空策略"
    display_name: "梦多空策略"
    description: "涨幅榜做空 + 追多交易系统"
    source: "我的小女人"
    document_path: "../梦多空策略.md"
    enabled: true
    priority: 75
    strategy_type: "涨幅榜策略"
    target_assets: "山寨币（涨幅榜常客）"
    core_logic: "空涨幅榜 + 追多"
    created_date: "2025-12-28"
    updated_date: "2025-12-28"
    
    # 策略参数
    parameters:
      # 做空策略参数
      short_strategy:
        min_gain_threshold: 20  # 单币涨幅超过20%开始筛选
        entry_zone: "1.618-2.0斐波扩展位"  # 做空入场区间
        stop_loss_pct: "1-2%"  # 止损幅度
        take_profit_levels: [50, 100, 200]  # 止盈档位（%）
        max_funding_rate: "1%/4h"  # 最大费率（超过不做）
        holding_time: "第二天上午到下午2点，最迟下午2点平仓"
      
      # 做多策略参数
      long_strategy:
        gain_range: [8, 12]  # 24小时涨幅区间8%-12%
        stop_loss_pct: 7  # 从顶部下跌7%止损
        take_profit_start: 20  # 20%开始分批止盈
        take_profit_range: [20, 60]  # 止盈区间20%-60%
        max_positions_per_day: 5  # 一天最多追5个标的
    
    # 市场环境要求
    market_conditions:
      scan_frequency: "每小时"
      pause_condition: "大盘下杀5000点以上暂停交易"
      resume_condition: "等两天后再恢复交易"
      expected_signals: "三天内应该会有三五个币（符合条件）"
    
    # 技术工具
    technical_tools:
      - "斐波那契扩展1.618计算"
      - "裸K线分析（H3D线）"
      - "关键点位支撑阻力"
      - "K线形态和K线组合"
    
    # 成功率预期
    success_rate:
      short_strategy: "约80%"
      long_strategy: "依赖市场环境（假突破率70-80%）"
    
    # 风险提示
    risk_warnings:
      - "需要特定的市场环境（涨幅榜活跃）"
      - "做多策略假突破率高，需要严格止损"
      - "大盘下杀时需暂停交易"
      - "需要每小时扫描，及时执行"

